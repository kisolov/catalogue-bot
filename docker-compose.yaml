services:
  postgres:
    image: postgres
    networks:
      - backend_network
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./migrations/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - logs:/app/logs
      - ./migrations:/app/migrations
      - ./main.py:/app/main.py
      - ./.env:/app/.env
      - ./config.py:/app/config.py
      - ./di.py:/app/di.py
      - ./tests:/app/tests
    networks:
      - backend_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - backend_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - backend_network
    restart: unless-stopped

volumes:
  pg_data:
  logs:
  pgadmin_data:

networks:
  backend_network:
    external: true
    name: ${PROJECT_NAME}_network
