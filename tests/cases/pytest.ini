[pytest]
rootdir = "../../"
testpaths = "."
python_files = test_*.py *_test.py
python_classes = *Test*
markers =
    focused: currently focused tests
    slow: slow running tests
    integration: integration tests
    e2e: end-to-end tests

asyncio_mode = auto
addopts = -m "not slow" -k "not Base"
