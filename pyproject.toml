[project]
name = "catalogue-backend"
version = "1.0.0"
description = "Backend каталога товаров для Telegram Mini App"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "dependency-injector>=4.42",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "redis>=5.0",
    "pyjwt>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi-cache2>=0.2.2",
    "python-dotenv>=1.0",
    "python-json-logger>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "faker>=30",
    "black>=24.10",
    "flake8>=7.1",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["focused: run only tests marked focused"]
